<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>autoregen — how the exam works</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%161c20'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%23d4d9dd' stroke-width='1'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A walkthrough of autoregen: what the agent is given, what a STEP file is, and how one solver is scored against twelve parametric CAD families."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-mode="lesson">
    <div id="app">
      <canvas id="stage"></canvas>

      <div id="ui">
        <div id="progress"></div>

        <header class="titleblock">
          <div class="tb-mark">
            <span class="tb-name">AUTOREGEN</span>
            <span class="tb-job">Recover design intent, not one solid</span>
          </div>
          <div class="tb-sheet">
            <span class="tb-label">Sheet</span>
            <span id="sheet-no">01</span>
            <span class="tb-of">of</span>
            <span id="sheet-of">09</span>
          </div>
          <div class="tb-title" id="sheet-name">What we are testing</div>
          <nav class="mode">
            <button id="btn-intro" type="button">The exam</button>
            <button id="btn-run" type="button">One run</button>
          </nav>
        </header>

        <aside class="sheets" id="sheets" aria-label="Lesson sheets"></aside>
        <aside class="rail" id="rail" aria-label="Generations"></aside>
        <aside class="families" id="families" aria-label="Twelve tasks"></aside>

        <div id="stage-legend"></div>

        <footer class="dock">
          <div class="scrub" id="scrub" aria-label="Step scrubber"></div>
          <div class="dock-copy">
            <div class="kicker" id="kicker"></div>
            <h1 id="title"></h1>
            <p id="body"></p>
          </div>

          <div class="dock-side">
            <div class="scorebox" id="scorebox" hidden>
              <div class="score-caption" id="score-caption">intent_err</div>
              <div class="score" id="score">0.258</div>
              <div class="score-bar" aria-hidden="true"><i id="score-fill"></i></div>
            </div>
            <div id="artifact"></div>
          </div>

          <div class="transport">
            <div class="views">
              <button data-view="hero" type="button">This family</button>
              <button data-view="members" type="button">All four sizes</button>
              <button data-view="gallery" type="button">All twelve tasks</button>
            </div>
            <div class="playhead">
              <button id="btn-prev" type="button" aria-label="Previous step">Prev</button>
              <button id="btn-play" class="primary" type="button">Play</button>
              <button id="btn-next" type="button" aria-label="Next step">Next</button>
              <span class="step-count" id="step-count">1 / 31</span>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
